<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
	<!-- Topo externo (borda branca) -->
	<polygon
		points="60,12 102,36 60,60 18,36"
		fill="#FFFFFF"
		stroke="#171717"
		stroke-width="2"
		stroke-linejoin="round"
	/>
	<!-- Interior aberto (quarto branco) -->
	<polygon
		points="60,20 92,38 60,56 28,38"
		fill="#EBEAE6"
		stroke="#171717"
		stroke-width="1.5"
		stroke-linejoin="round"
	/>
	<!-- Parede interna direita com sombra suave -->
	<polygon
		points="60,20 92,38 60,46"
		fill="#C6C5C1"
		opacity="0.45"
	/>
	<!-- Aresta interna vertical -->
	<line
		x1="60"
		y1="20"
		x2="60"
		y2="56"
		stroke="#171717"
		stroke-width="1.2"
		opacity="0.45"
	/>
	<!-- Face esquerda (carbono) -->
	<polygon
		points="18,36 60,60 60,108 18,84"
		fill="#171717"
		stroke="#171717"
		stroke-width="2"
		stroke-linejoin="round"
	/>
	<!-- Face direita (ocre) -->
	<polygon
		points="60,60 102,36 102,84 60,108"
		fill="#CD9016"
		stroke="#171717"
		stroke-width="2"
		stroke-linejoin="round"
	/>
</svg>
